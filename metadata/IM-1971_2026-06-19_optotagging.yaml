# One session YAML per raw Open Ephys recording folder. This one: the
# optotagging recording. See metadata/README.md for the full schema.

session_id: IM-1971_2026-06-19_optotagging
animal: IM-1971
date: 2026-06-19
session_type: optotagging         # behavior | optotagging
description: "Optotagging survey, same probe/bank config as the behavior session"

open_ephys:
  folder_path: 'E:\D1-1-4_IM-1971\ephys_raw\2026-06-19_15-40-02'

probe_streams: [ProbeA]

adc:
  sync_1hz: 0
  port_visits: 2

optotagging:
  laser_inputs:                   # ADC column index per laser colour
    - {color: blue, adc_channel: 1}
    - {color: red,  adc_channel: 3}

  # All three blocks below are optional; omitted keys fall back to the
  # Berke-lab-pipeline defaults (src/preprocess.py DEFAULT_* dicts).

  pulse_detection:                # -> detect_laser_pulses (load_laser_pulses_from_oe_adc.m)
    threshold_volts: 2.0
    polarity: positive
    min_width_ms: 5.0
    max_width_ms: 30.0
    min_interpulse_ms: 50.0

  lag_estimation:                 # -> estimate_artifact_lag (estimate_laser_artifact_lag_from_L.m)
    probe_channel: 80             # 0-indexed, same convention as OpenEphys / bad_channels
    search_window_ms: [-5, 8]
    artifact_sign: negative
    max_pulses: 200

  artifact_mask:                  # -> build_mask_windows (mask_probe_dat_artifacts.m)
    pre_on_ms: 0.1
    post_on_ms: 1.0
    pre_off_ms: 0.1
    post_off_ms: 1.0
    method: linear               # linear | zero
